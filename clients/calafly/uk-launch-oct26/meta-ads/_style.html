<style>
/* Layout: a working checklist in one column (max 960px). Parts A–E run in the order the build happens in Google Ads.
   Part B/C switch by country tab and fill every value for that campaign. Brand cue: ink outline + teal offset
   shadow, used only on the country switcher and the step being worked on. */
:root {
  --bg: #f5f8f9; --surface: #ffffff; --fg: #0b0d10; --muted: #56606b; --line: #dbe2e7;
  --teal: #0f9c83; --teal-soft: #dff5f0; --ink: #0b0d10; --shadow: #18c8a8; --warn: #9a5b00; --warn-soft: #fff3dc;
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0d10; --surface: #14181d; --fg: #eef2f4; --muted: #9aa5af; --line: #2a3138;
  --teal: #2fdcbc; --teal-soft: #10302a; --ink: #eef2f4; --shadow: #18c8a8; --warn: #ffc566; --warn-soft: #33270f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0d10; --surface: #14181d; --fg: #eef2f4; --muted: #9aa5af; --line: #2a3138;
  --teal: #2fdcbc; --teal-soft: #10302a; --ink: #eef2f4; --shadow: #18c8a8; --warn: #ffc566; --warn-soft: #33270f; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.6 var(--body) }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 18px; padding-block: 36px 80px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 56px }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.02em }
h1 { font-size: clamp(34px, 6vw, 54px); font-weight: 800; line-height: 1.02 }
h2 { font-size: clamp(24px, 3.4vw, 32px); font-weight: 800; line-height: 1.1 }
h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em }
p { margin: 0; max-width: 70ch }
code, .mono { font-family: var(--mono); font-size: .88em }
.muted { color: var(--muted) }
.eyebrow { font: 600 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--teal) }
section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0 }
.part { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap }
.part .tag { font: 800 15px var(--display); color: var(--bg); background: var(--ink); border-radius: 6px; padding: 2px 9px }

header { display: grid; gap: 16px }
header .lede { font-size: 18px; color: var(--muted) }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; border-top: 1px solid var(--line); padding-top: 14px }
.facts div { display: grid; gap: 2px }
.facts b { font: 800 24px/1 var(--display); font-variant-numeric: tabular-nums }
.facts span { font-size: 13px; color: var(--muted) }
.progress { display: grid; gap: 6px }
.progress .track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden }
.progress .fill { height: 100%; background: var(--teal); width: 0; transition: width .2s }
.progress span { font-size: 13px; color: var(--muted) }

/* steps */
.steps { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid;
  grid-template-columns: 28px minmax(0, 1fr); gap: 4px 14px }
.step.done { opacity: .62 }
.step input[type=checkbox] { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--teal); cursor: pointer }
.step .body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0 }
.step .id { font: 500 12.5px var(--mono); color: var(--muted); margin-right: 6px }
.path { font: 500 13.5px var(--mono); color: var(--teal); background: var(--teal-soft); border-radius: 6px; padding: 3px 8px; justify-self: start; max-width: 100% }
.step ul, .step ol { margin: 0; padding-left: 20px; display: grid; gap: 4px }
.step li { max-width: 72ch }
.kv { display: grid; grid-template-columns: minmax(120px, max-content) minmax(0, 1fr); gap: 6px 16px; font-size: 15px }
.kv dt { color: var(--muted) }
.kv dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere }
.note { font-size: 14px; color: var(--muted) }
.warn { background: var(--warn-soft); border: 1px solid var(--warn); color: var(--fg); border-radius: 8px; padding: 8px 12px; font-size: 14px }
.warn b { color: var(--warn) }

/* copy blocks */
.copy { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px }
.copy .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap }
.copy .bar span { font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.copy pre { margin: 0; font: 400 13px/1.55 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-word }
button { font: 600 13px var(--body); color: var(--fg); background: var(--surface); border: 1.5px solid var(--ink); border-radius: 8px; padding: 4px 11px; cursor: pointer }
button:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px }
button.ok { background: var(--teal); border-color: var(--teal); color: #0b0d10 }
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.lines li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 14.5px; max-width: none }
.lines li:last-child { border-bottom: 0 }
.lines .n { font: 500 12px var(--mono); color: var(--muted) }
.lines .c { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.lines .pin { font: 700 11px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--teal); margin-left: 6px }
.lines button { padding: 2px 9px; font-size: 12px }

/* country switch */
.switch { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.switch button { font: 700 15px var(--body); border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 16px; background: var(--surface) }
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: 4px 4px 0 var(--shadow) }
.switch .meta { font: 500 13px var(--mono); color: var(--muted); margin-left: auto }
.adgroup { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; background: var(--bg) }
.adgroup h4 { margin: 0; font: 800 17px var(--display) }

/* optimisation */
.rhythm { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden }
.rhythm > div { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--line) }
.rhythm > div:last-child { border-bottom: 0 }
.rhythm .when { font: 700 14px var(--body) }
.rhythm .when small { display: block; font: 500 12px var(--mono); color: var(--muted) }
.rhythm ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 15px }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 14.5px }
th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--line) }
tr:last-child td { border-bottom: 0 }
th { font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px }

@media (max-width: 640px) {
  .rhythm > div { grid-template-columns: minmax(0, 1fr); gap: 6px }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 0 }
  .kv dd { margin-bottom: 8px }
  .switch .meta { margin-left: 0; width: 100% }
  .step { padding: 14px; gap: 4px 10px }
}
@media (prefers-reduced-motion: reduce) { .progress .fill { transition: none } }
</style>
