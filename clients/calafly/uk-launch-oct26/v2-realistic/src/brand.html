<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="kit.css">
<style>
/* Brand campaign films: "Sorted before you fly." 30s walkthrough + 6s bumper. Same layout system as the 15s films. */
body { background: var(--ink); overflow: hidden; }
#v { position: relative; overflow: hidden; background: var(--ink); color: #fff; }
.f-9x16 { width: 1080px; height: 1920px; }
.f-16x9 { width: 1920px; height: 1080px; }
.band { position: absolute; z-index: 10; }
.f-9x16 .band { left: 64px; right: 64px; top: 250px; height: 520px; }
.f-16x9 .band { left: 80px; top: 0; width: 760px; height: 1080px; }
.stage { position: absolute; width: 1080px; height: 1080px; overflow: hidden; }
.f-9x16 .stage { left: 0; top: 780px; border-radius: 48px 48px 0 0; }
.f-16x9 .stage { left: 840px; top: 0; }
.topbar { position: absolute; z-index: 12; display: flex; justify-content: space-between; align-items: center; }
.f-9x16 .topbar { left: 64px; right: 64px; top: 130px; }
.f-16x9 .topbar { left: 80px; right: 1160px; top: 60px; }
.f-16x9 .topbar .url { display: none; }
.url { font: 800 30px "CFD"; color: var(--teal); }
.line { position: absolute; left: 0; right: 0; opacity: 0; }
.f-9x16 .line { top: 60px; }
.f-16x9 .line { top: 50%; }
.line h1 { font: 800 108px/0.94 "CFD"; letter-spacing: -0.045em; margin-top: 22px; }
.line .sub { font: 600 36px/1.2 "CFD"; letter-spacing: -0.015em; color: #e6ebef; margin-top: 20px; max-width: 900px; }
.f-16x9 .line h1 { font-size: 100px; }
.step { display: inline-flex; align-items: center; gap: 14px; font: 800 26px "CFD"; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); }
.step .n { width: 58px; height: 58px; border-radius: 16px; border: 4px solid #fff; background: var(--teal); color: var(--ink); display: grid; place-items: center; font-size: 34px; letter-spacing: 0; }
.progress { position: absolute; z-index: 12; display: flex; gap: 10px; }
.f-9x16 .progress { left: 64px; top: 205px; }
.f-16x9 .progress { left: 80px; top: 150px; }
.progress i { width: 64px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; position: relative; }
.progress i b { position: absolute; inset: 0; background: var(--teal); transform-origin: 0 50%; transform: scaleX(0); }
.small { position: absolute; z-index: 12; font: 500 23px/1.35 "CFD"; color: var(--muted); }
.f-9x16 .small { left: 64px; right: 64px; top: 700px; }
.f-16x9 .small { left: 80px; width: 720px; bottom: 50px; }
.scene { position: absolute; inset: 0; opacity: 0; }
.scene .layer { position: absolute; inset: 0; }
.scene canvas.fill { position: absolute; inset: 0; width: 100%; height: 100%; }
.studio { background: radial-gradient(90% 70% at 60% 35%, #2a3a3a 0%, #13181b 55%, #07090b 100%); }
.terminal { background: linear-gradient(180deg, #1b2027, #0d1014 70%); }
.endcard { background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; text-align: center; }
.endcard .logo { font-size: 66px; padding: 22px 36px 22px 24px; border-width: 6px; border-radius: 34px; }
.endcard .logo .dot { width: 76px; height: 76px; }
.endcard .logo .dot::after { width: 26px; height: 26px; }
.endcard .line2 { font: 800 92px/0.95 "CFD"; letter-spacing: -0.045em; }
.endcard .line2 .hl { color: var(--pink); }
.endcard .cta { font-size: 44px; padding: 24px 44px; }
.endcard .ticks { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; }
.endcard .ticks div { display: flex; align-items: center; gap: 12px; font: 700 28px "CFD"; letter-spacing: -0.02em; }
.endcard .ticks .tick { width: 38px; height: 38px; }
.endcard .ticks .tick svg { width: 20px; height: 20px; }
.vprice { display: flex; align-items: flex-end; gap: 20px; margin-top: 20px; }
.vprice .amt { font: 800 190px/0.8 "CFD"; letter-spacing: -0.07em; }
.vprice .amt sup { font-size: .42em; vertical-align: 1.05em; color: var(--teal); }
.vprice .per { font: 800 38px/1.05 "CFD"; letter-spacing: -0.02em; padding-bottom: 8px; }
.vprice .per small { display: block; font: 600 26px/1.2 "CFD"; color: var(--muted); margin-top: 6px; }
.f-9x16 .vprice { margin-top: 6px; } .f-9x16 .vprice .amt { font-size: 98px; } .f-9x16 .vprice .per { font-size: 32px; padding-bottom: 2px; } .f-9x16 .vprice .per small { font-size: 23px; }
.sub b { color: var(--teal); font-weight: 800; font-size: 1.5em; letter-spacing: -0.03em; }
.endcard .eprice { display: flex; align-items: center; border: 5px solid #fff; border-radius: 20px; overflow: hidden; box-shadow: 8px 8px 0 var(--teal); background: #fff; color: var(--ink); }
.endcard .eprice span { padding: 12px 22px; font: 700 32px "CFD"; }
.endcard .eprice b { background: var(--ink); color: var(--teal); font: 800 62px "CFD"; letter-spacing: -0.04em; padding: 4px 22px; }
.endcard .eprice em { font-style: normal; background: var(--yellow); font: 800 26px/1.05 "CFD"; padding: 12px 18px; border-left: 5px solid var(--ink); }
.touch { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 0 0 3px rgba(11,13,16,.25); opacity: 0; z-index: 50; pointer-events: none; }
</style>
</head>
<body>
<div id="v"></div>
<script src="qr.js"></script>
<script src="../../src/offers.js"></script>
<script src="kit.js"></script>
<script>
const P = new URLSearchParams(location.search);
const which = P.get("v") || "brand";
const fmt = P.get("f") || "9x16";
const C = K.COUNTRIES[P.get("c") || "dubai"];
const v = document.getElementById("v");
v.className = `f-${fmt}`;
K.showOffer = true;
const O = OFFERS, OF = O.get(C.key);
const BASE = O.small(C.key), REFUND_ALL = O.small(C.key, { refund: true });
const PRICE = OF ? `<div class="vprice"><div class="amt"><sup>£</sup>${OF.price}</div><div class="per">${OF.data} · ${OF.days} days<small>Paid once. No daily charges.</small></div></div>` : "";
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = q => v.querySelector(q);
const phone = (screen, id, style, opts) => `<div class="phone3d" id="${id}" style="${style}">${K.iphone(screen, opts)}</div>`;

const SC = {
  board: `<div class="layer terminal"></div>
    <div id="boardwrap" style="position:absolute;left:30px;top:250px;transform-origin:50% 40%">${K.board(C)}</div>`,
  pick: `<div class="layer"><canvas class="fill" data-fabric="#b9b2a6" width="540" height="540"></canvas></div>
    ${phone(K.screenPick(C), "ph_pick", "left:320px;top:70px")}<div class="touch" id="touch1"></div>`,
  order: `<div class="layer"><canvas class="fill" data-wood="1" width="540" height="540"></canvas></div>
    ${K.boardingPass(C, "left:40px;top:690px;transform:rotate(-11deg)")}
    ${phone(K.screenOrder(C), "ph_order", "left:470px;top:60px", { flat: true })}`,
  scan: `<div class="layer"><canvas class="fill" data-fabric="#b9b2a6" width="540" height="540"></canvas></div>
    <div class="layer" id="lap"><div style="position:absolute;left:-60px;top:330px;transform:scale(.9);transform-origin:0 0">${K.laptopQR()}</div></div>
    ${phone(K.screenCamera(C, { progress: 0 }), "ph_cam", "left:600px;top:1200px")}`,
  window: `<div class="layer cabin"></div>
    <div class="layer" id="winwrap"><div class="bezelring" style="left:180px;top:80px;width:720px;height:960px"></div>
      <div class="window" style="left:236px;top:140px;width:608px;height:840px"><canvas id="sky" data-sky="${C.sky}" width="480" height="700"></canvas><div class="shade" id="shade" style="height:22%"></div></div></div>
    ${phone(K.lockScreen(C, `<div id="n1" style="opacity:0">${K.notif({ title: "Mum", body: "Landed safe? Send a pic when you can x" })}</div><div id="n2" style="opacity:0;margin-top:10px">${K.notif({ title: "Holiday group", body: "Taxi rank is just outside arrivals" })}</div>`), "ph_lock", "left:320px;top:1200px")}`,
  refund: `<div class="layer studio"></div>
    ${phone(K.screenRefund(C), "ph_ref", "left:330px;top:70px")}<div class="touch" id="touch2"></div>
    <div class="toast" id="toast" style="left:160px;top:780px;opacity:0"><span class="ic appicon"></span><div><b>100% refund on its way</b><span>${C.plan} · unused</span></div></div>`,
  end: `<div class="layer endcard">${K.logo()}
    <div class="line2">Sorted<br><span class="hl">before you fly.</span></div>
    ${OF ? `<div class="eprice"><span>${C.short} · ${OF.data} · ${OF.days} days</span><b>${O.price(C.key)}</b>${OF.code ? `<em>10% off<br>code ${OF.code}</em>` : ""}</div>` : ""}
    <div class="ticks">${["Set up in minutes", "Pay once, not per day", "100% refund if unused"].map(t => `<div><span class="tick">${K.tickSvg()}</span>${t}</div>`).join("")}</div>
    <span class="cta">Get Calafly</span></div>`,
};

// timelines: scenes [name, t0, t1, {local timing}], lines [t0, t1, html], progress step per window
const V = {
  brand: {
    dur: 30,
    scenes: [["board", 0, 3.7], ["pick", 3.6, 8.1, { enter: 0.0, tap: 2.2 }], ["order", 8.0, 12.3], ["scan", 12.2, 17.1, { enter: 0.1, st: 0.9, dur: 1.6 }],
             ["window", 17.0, 22.5, { enter: 1.6, n1: 2.9 }], ["refund", 22.4, 26.1, { tap: 1.1 }], ["end", 26.0, 30.01]],
    lines: [
      [0.2, 3.6, `<h1>Mobile data abroad?<br><span class="hl">Sort it before you fly.</span></h1>`],
      [3.7, 8.0, `<span class="step"><span class="n">1</span>Pick</span><h1>Pick your<br><span class="hl">destination.</span></h1><p class="sub">The USA, Turkey or Dubai. One plan for the whole trip.</p>`],
      [8.1, 12.2, `<span class="step"><span class="n">2</span>Pay</span><h1>Pay once.<br><span class="hl">Not per day.</span></h1>${OF ? PRICE : `<p class="sub">No daily charges from us.</p>`}`],
      [12.3, 17.0, `<span class="step"><span class="n">3</span>Scan</span><h1>Scan the<br><span class="hl">QR code.</span></h1><p class="sub">At home, in minutes. Your number stays the same.</p>`],
      [17.1, 22.4, `<span class="step"><span class="n">4</span>Land</span><h1>Wheels down.<br><span class="hl">Data on.</span></h1><p class="sub">Switch it on when you land.</p>`],
      [22.5, 26.0, `<span class="step">And if plans change</span><h1>Plans changed?<br><span class="hl">100% refund.</span></h1><p class="sub">Guaranteed, if your eSIM is unused.</p>`],
    ],
    steps: [[3.6, 8.1], [8.0, 12.3], [12.2, 17.1], [17.0, 22.5]],
    refundFrom: 22.4,
    cues: [[0.0, "roomtone", 3.8], [0.3, "flaps", 1.8], [3.6, "swish"], [5.8, "tap"], [6.0, "notif_soft"], [8.0, "swish"], [9.4, "confirm_soft"],
           [12.2, "swish"], [12.6, "shutter"], [14.7, "confirm"], [17.0, "swish"], [17.0, "air", 5.6], [17.3, "chime"], [18.4, "touchdown"],
           [19.9, "notif"], [20.7, "notif_soft"], [22.4, "swish"], [23.5, "tap"], [23.8, "confirm_soft"], [26.0, "logo"]],
  },
  bumper: {
    dur: 6,
    scenes: [["window", 0, 3.9, { enter: 0.0, n1: 1.2, shake: [0.2, 0.9] }], ["end", 3.8, 6.01]],
    lines: [[0.15, 3.8, `<h1>Wheels down.<br><span class="hl">Data on.</span></h1><p class="sub">${OF ? `${C.short} · ${OF.data} · ${OF.days} days for <b>${O.price(C.key)}</b>. Sorted before you fly.` : `${C.short} data, sorted before you fly.`}</p>`]],
    steps: [],
    refundFrom: 99,
    cues: [[0.0, "air", 3.9], [0.25, "touchdown"], [1.2, "notif"], [1.95, "notif_soft"], [3.7, "swish"], [3.8, "logo"]],
  },
};
const T = V[which];
window.CUES = T.cues; window.DUR = T.dur;

v.innerHTML = `
  <div class="topbar">${K.logo()}<span class="url">calafly.net</span></div>
  ${T.steps.length ? `<div class="progress">${T.steps.map(() => "<i><b></b></i>").join("")}</div>` : ""}
  <div class="band">${T.lines.map((l, i) => `<div class="line" id="l${i}">${l[2]}</div>`).join("")}</div>
  <p class="small" id="small"></p>
  <div class="stage">${T.scenes.map(([k], i) => `<div class="scene" id="s${i}">${SC[k]}</div>`).join("")}</div>`;
K.paintAll(v);

function tapAt(el, sel, p, at) { // finger tap: ripple over a target inside the phone
  const t = el.querySelector(sel); if (!t) return;
  const target = el.querySelector(sel === "#touch1" ? `.pick[data-k="${C.key}"]` : "#refundbtn");
  const r = target.getBoundingClientRect(), s = el.closest(".stage").getBoundingClientRect(), sc = s.width / 1080;
  t.style.left = `${(r.left + r.width * 0.72 - s.left) / sc}px`; t.style.top = `${(r.top + r.height / 2 - s.top) / sc}px`;
  const k = (p - at) / 0.45;
  t.style.opacity = k > 0 && k < 1 ? (1 - k) * 0.9 : 0;
  t.style.transform = `scale(${0.6 + 0.8 * clamp(k)})`;
}

const ANIM = {
  board(el, p) {
    el.querySelectorAll(".r").forEach((row, ri) => row.querySelectorAll(".flap").forEach((f, i) => {
      if (!f.dataset.ch) f.dataset.ch = f.textContent;
      const done = p > 0.3 + ri * 0.16 + i * 0.03 + (row.classList.contains("hi") ? 0.7 : 0);
      f.textContent = done ? f.dataset.ch : "ABCDEFGHIJKLMNOPRSTUVWXY0123456789"[Math.floor((p * 40 + i * 7 + ri * 3) % 34)];
    }));
    el.querySelector("#boardwrap").style.transform = `scale(${0.97 + p * 0.012})`;
  },
  pick(el, p, o) {
    const ph = el.querySelector("#ph_pick");
    ph.style.transform = `perspective(2600px) rotateY(${-14 + p * 1.5}deg) rotateX(5deg) rotateZ(-3deg) scale(.96)`;
    el.querySelectorAll(".pick").forEach(c => {
      const on = c.dataset.k === C.key && p > o.tap + 0.1;
      c.style.background = on ? "var(--teal)" : "#fff"; c.querySelector(".pk").style.opacity = on ? 1 : 0;
      c.style.transform = c.dataset.k === C.key && p > o.tap && p < o.tap + 0.15 ? "scale(.97)" : "scale(1)";
    });
    el.querySelector("#pickbtn").style.opacity = p > o.tap + 0.3 ? 1 : 0.35;
    tapAt(el, "#touch1", p, o.tap);
  },
  order(el, p) {
    el.querySelector("#ph_order").style.transform = `rotate(${6 - p * 0.6}deg) scale(${0.95 + p * 0.006})`;
    el.querySelectorAll(".row2").forEach((r, i) => { r.style.opacity = 0.25 + 0.75 * ease((p - 0.4 - i * 0.14) / 0.3); });
    el.querySelectorAll(".row2 .ok").forEach((r, i) => { const k = back((p - 0.9 - i * 0.4) / 0.3); r.style.display = "inline-block"; r.style.transform = `scale(${0.6 + 0.4 * k})`; });
  },
  scan(el, p, o) {
    el.querySelector("#lap").style.transform = `scale(${1.02 + p * 0.01})`;
    const ph = el.querySelector("#ph_cam");
    ph.style.top = `${1200 - ease((p - o.enter) / 0.8) * 1150}px`;
    ph.style.transform = `perspective(2600px) rotateY(-16deg) rotateX(6deg) rotateZ(-3deg) scale(.92)`;
    const pr = clamp((p - o.st) / o.dur);
    el.querySelector("#esimbar").style.width = `${pr * 100}%`;
    el.querySelector("#esimsheet h4").textContent = pr >= 1 ? "eSIM activated" : "Activating eSIM";
    el.querySelector("#esimsheet").style.transform = `translateY(${(1 - ease((p - o.st + 0.4) / 0.4)) * 300}px)`;
  },
  window(el, p, o, t) {
    el.querySelector("#sky").style.transform = `translateX(${-p * 14}px) translateY(${Math.sin(p * 1.3) * 3}px)`;
    const sh = o.shake || [1.35, 2.3];
    const shake = p > sh[0] && p < sh[1] ? Math.sin(p * 90) * (sh[1] - p) * 6 : 0;
    el.querySelector("#winwrap").style.transform = `translateY(${shake}px) scale(${1.04 + p * 0.004})`;
    el.querySelector("#shade").style.height = `${22 - ease(p / 2) * 8}%`;
    const ph = el.querySelector("#ph_lock"), k = ease((p - o.enter) / 0.9);
    ph.style.top = `${1200 - k * 1120}px`;
    ph.style.transform = `perspective(2600px) rotateY(-12deg) rotateX(4deg) rotateZ(${-6 + k * 2}deg) scale(.94)`;
    [["#n1", o.n1], ["#n2", o.n1 + 0.8]].forEach(([q, at]) => { const e = el.querySelector(q), b = back((p - at) / 0.35); e.style.opacity = clamp((p - at) / 0.15); e.style.transform = `translateY(${(1 - b) * -40}px) scale(${0.9 + 0.1 * b})`; });
  },
  refund(el, p, o) {
    el.querySelector("#ph_ref").style.transform = `perspective(2600px) rotateY(${16 - p * 2}deg) rotateX(5deg) rotateZ(3deg) scale(.96)`;
    el.querySelector("#refundbtn").style.transform = p > o.tap && p < o.tap + 0.18 ? "scale(.96)" : "scale(1)";
    tapAt(el, "#touch2", p, o.tap);
    const ts = el.querySelector("#toast"), k = back((p - o.tap - 0.3) / 0.4);
    ts.style.opacity = clamp((p - o.tap - 0.3) / 0.2); ts.style.transform = `translateX(${(1 - k) * -160}px) rotate(-3deg)`;
  },
  end(el, p) {
    el.querySelectorAll(".logo, .line2, .eprice, .ticks, .cta").forEach((k, i) => { const e = back((p - 0.1 - i * 0.14) / 0.45); k.style.opacity = clamp((p - 0.1 - i * 0.14) / 0.2); k.style.transform = `translateY(${(1 - e) * 40}px)`; });
  },
};

window.renderFrame = (t) => {
  T.scenes.forEach(([k, t0, t1, o = {}], i) => {
    const el = document.getElementById(`s${i}`), vis = t >= t0 && t < t1;
    const fin = clamp((t - t0) / 0.3), fout = i === T.scenes.length - 1 ? 0 : clamp((t - (t1 - 0.3)) / 0.3);
    el.style.opacity = vis ? Math.min(fin, 1 - fout) : 0;
    el.style.transform = `scale(${1 + (1 - ease(fin)) * 0.06})`;
    if (vis) ANIM[k](el, t - t0, o, t);
  });
  T.lines.forEach(([t0, t1], i) => {
    const el = document.getElementById(`l${i}`), vis = t >= t0 && t < t1;
    const fin = ease((t - t0) / 0.35), fout = ease((t - (t1 - 0.2)) / 0.2);
    el.style.opacity = vis ? Math.min(fin, 1 - fout) : 0;
    el.style.transform = `${fmt === "16x9" ? "translateY(-50%) " : ""}translateY(${(1 - fin) * 30}px)`;
  });
  v.querySelectorAll(".progress i b").forEach((b, i) => { const [a, z] = T.steps[i]; b.style.transform = `scaleX(${clamp((t - a) / (z - a))})`; });
  const pr = $(".progress"); if (pr) pr.style.opacity = t > 3.4 && t < 26 ? 1 : 0;
  $("#small").innerHTML = t >= T.refundFrom ? REFUND_ALL : BASE;
};
document.fonts.ready.then(() => { window.renderFrame(0); document.body.dataset.ready = "1"; });
</script>
</body>
</html>
