<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="kit.css">
<style>
/* Google Merchant Center product images. Main image: product on a clean light background, no promotional text,
   badges, borders or watermarks (Google Shopping image policy). Lifestyle images: the product in use, also overlay-free. */
html, body { background: #888; margin: 0; }
#img { position: relative; width: 1500px; height: 1500px; overflow: hidden; }
.studio-light { position: absolute; inset: 0; background: radial-gradient(80% 70% at 50% 38%, #ffffff 0%, #f1f3f6 58%, #e3e7ec 100%); }
.floor { position: absolute; left: 22%; right: 22%; bottom: 7%; height: 70px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.28), rgba(0,0,0,0)); filter: blur(10px); }
.subj { position: absolute; left: 0; top: 0; width: 1000px; height: 1000px; transform-origin: 0 0; transform: scale(1.5); }
.dest-hero { position: relative; height: 210px; border-radius: 18px; overflow: hidden; border: 2.5px solid var(--ink); box-shadow: 5px 5px 0 var(--teal); }
.dest-hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.dest-hero .nm { position: absolute; left: 16px; bottom: 12px; font: 800 44px/0.95 "CFD"; letter-spacing: -0.04em; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.35); }
.dest-hero .cc { position: absolute; right: 12px; top: 12px; background: #fff; color: var(--ink); border: 2.5px solid var(--ink); border-radius: 999px; padding: 3px 10px; font: 800 13px "CFD"; letter-spacing: .12em; }
</style>
</head>
<body>
<div id="img"></div>
<script src="qr.js"></script>
<script src="kit.js"></script>
<script>
const P = new URLSearchParams(location.search);
const key = P.get("p") || "turkey";
const kind = P.get("k") || "main";

// destinations in the client's Merchant Center catalogue (+ Dubai, missing from it)
const D = {
  turkey:   { name: "Turkey", short: "Turkey", tag: "Turkey", code: "TR", sky: "turkey", wall: ["#0b6e8a", "#5fd4c4", "#f6e7b0"], plan: "Turkey eSIM" },
  thailand: { name: "Thailand", short: "Thailand", tag: "Thailand", code: "TH", sky: "turkey", wall: ["#0f5e4f", "#40c9a2", "#ffd36e"], plan: "Thailand eSIM" },
  spain:    { name: "Spain", short: "Spain", tag: "Spain", code: "ES", sky: "dubai", wall: ["#7a1f2b", "#ff8a5c", "#ffd29a"], plan: "Spain eSIM" },
  france:   { name: "France", short: "France", tag: "France", code: "FR", sky: "usa", wall: ["#1d2b64", "#9aa7ff", "#f8c7a0"], plan: "France eSIM" },
  usa:      { name: "the USA", short: "USA", tag: "USA", code: "US", sky: "usa", wall: ["#1d2b64", "#f8a170", "#6a3093"], plan: "USA eSIM" },
  italy:    { name: "Italy", short: "Italy", tag: "Italy", code: "IT", sky: "dubai", wall: ["#2e4a2a", "#d9a35b", "#ffe2b0"], plan: "Italy eSIM" },
  japan:    { name: "Japan", short: "Japan", tag: "Japan", code: "JP", sky: "usa", wall: ["#2b1d4f", "#ff7aa8", "#ffc4d6"], plan: "Japan eSIM" },
  dubai:    { name: "Dubai", short: "Dubai", tag: "Dubai", code: "AE", sky: "dubai", wall: ["#3a1c71", "#d76d77", "#ffaf7b"], plan: "Dubai eSIM" },
  world500: { name: "Global", short: "Global", tag: "World", code: "200+", sky: "usa", wall: ["#0b1f3a", "#18c8a8", "#6a8dff"], plan: "Best World 500 MB" },
  world1:   { name: "Global", short: "Global", tag: "World", code: "200+", sky: "turkey", wall: ["#0b1f3a", "#18c8a8", "#6a8dff"], plan: "Best World 1 GB" },
  world3:   { name: "Global", short: "Global", tag: "World", code: "200+", sky: "dubai", wall: ["#0b1f3a", "#18c8a8", "#6a8dff"], plan: "Best World 3 GB" },
};
const C = Object.assign({ key, board: "", city: "" }, D[key]);
K.COUNTRIES[key] = C;   // lets the kit's lock-screen wallpaper painter find this destination

const isWorld = key.startsWith("world");
const productScreen = K.web(`
  <span class="chip">eSIM · data only</span>
  <div class="dest-hero"><canvas data-sky="${C.sky}" data-seed="${key.length * 7}" width="360" height="210"></canvas>
    <div class="nm">${isWorld ? "200+<br>countries" : C.name.replace("the ", "")}</div><span class="cc">${C.code}</span></div>
  <div class="card2" style="display:flex;align-items:center;gap:12px;padding:12px 14px">
    <span class="appicon" style="width:46px;height:46px;border-radius:12px;flex:0 0 auto"></span>
    <div style="flex:1"><b style="font:800 21px CFD;letter-spacing:-.02em">${C.plan}</b><div style="font:500 13.5px UI;color:#59616b;margin-top:2px">QR code by email · install before you fly</div></div>
  </div>
  <div class="card2" style="display:grid;gap:9px;padding:12px 14px">
    ${["Keep your WhatsApp number", "One price, not per day", "Refund if not installed"].map(t => `<div style="display:flex;gap:10px;align-items:center;font:600 15px UI"><span class="tick">${K.tickSvg()}</span>${t}</div>`).join("")}
  </div>
  <div class="bigbtn">Install eSIM</div>`);

const scenes = {
  // main image: the product alone, centred, light studio
  main: `<div class="studio-light"></div><div class="floor"></div>
    <div class="subj"><div class="phone3d" style="left:280px;top:40px;transform:perspective(2600px) rotateY(-10deg) rotateX(3deg) rotateZ(-2deg) scale(1.0)">${K.iphone(productScreen)}</div></div>`,
  // lifestyle 1: arrival, plane window with destination sky, lock screen shows the CalaFly line
  arrive: `<div class="layer cabin" style="position:absolute;inset:0"></div>
    <div class="subj">
      <div class="bezelring" style="left:60px;top:40px;width:560px;height:760px"></div>
      <div class="window" style="left:104px;top:88px;width:472px;height:664px"><canvas data-sky="${C.sky}" width="420" height="600"></canvas><div class="shade" style="height:18%"></div></div>
      <div class="phone3d" style="left:470px;top:90px;transform:perspective(2600px) rotateY(-14deg) rotateX(4deg) rotateZ(-5deg) scale(.95)">
        ${K.iphone(K.lockScreen(C, K.notif({ title: "Mum", body: "Landed safe? Send a pic when you can x" })))}</div></div>`,
  // lifestyle 2: install at home, flatlay with boarding pass and the product screen
  home: `<div style="position:absolute;inset:0"><canvas data-wood="1" width="600" height="600" style="width:100%;height:100%"></canvas></div>
    <div class="subj">
      ${K.boardingPass(Object.assign({}, C, { code: { turkey: "IST", thailand: "BKK", spain: "BCN", france: "CDG", usa: "JFK", italy: "FCO", japan: "HND", dubai: "DXB" }[key] || "ANY" }), "left:40px;top:640px;transform:rotate(-10deg)")}
      <div class="phone3d" style="left:430px;top:30px;transform:rotate(6deg) scale(.98)">${K.iphone(productScreen, { flat: true })}</div></div>`,
};

document.getElementById("img").innerHTML = scenes[kind];
K.paintAll(document.getElementById("img"));
document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
